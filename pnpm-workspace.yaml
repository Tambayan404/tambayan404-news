# pnpm 10+ blocks dependency build scripts unless approved here.
allowBuilds:
  esbuild: true
  workerd: true

# pnpm's supply-chain policy refuses packages published in the last 24h. The current
# wrangler/workerd release was cut a day before this project was created; drop these
# once a newer release is old enough (`pnpm update wrangler`).
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260911.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260911.1'
  - '@cloudflare/workerd-linux-64@1.20260911.1'
  - '@cloudflare/workerd-linux-arm64@1.20260911.1'
  - '@cloudflare/workerd-windows-64@1.20260911.1'
  - miniflare@5.20260911.0-alpha
  - workerd@1.20260911.1
  - wrangler@4.131.1
